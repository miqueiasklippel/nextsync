name: Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from manifest.json
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.value }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.value }} already exists. Nothing to do."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.existing.outputs.found == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.existing.outputs.found == 'false'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: steps.existing.outputs.found == 'false'
        run: npm run lint

      - name: Test
        if: steps.existing.outputs.found == 'false'
        run: npm test

      - name: Build
        if: steps.existing.outputs.found == 'false'
        run: npm run build

      - name: Check versions.json
        if: steps.existing.outputs.found == 'false'
        run: |
          node -e "
            const v = require('./manifest.json').version;
            if (!require('./versions.json')[v]) {
              console.error('versions.json has no entry for ' + v);
              process.exit(1);
            }
          "

      - name: Attest build provenance
        if: steps.existing.outputs.found == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.value }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.value }}" \
            --generate-notes \
            main.js manifest.json styles.css
